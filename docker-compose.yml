version: '3.8'

services:
  # -------------------------------------------------------------
  # Document Database (MongoDB)
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: sonic_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sonic_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Vector Database (ChromaDB)
  # -------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: sonic_chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - sonic_network

  # -------------------------------------------------------------
  # Core Audio ML Service (Python / FastAPI)
  # -------------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sonic_ml_service
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - panns_cache:/root/panns_data
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=sonic_fingerprints
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - PYTHONUNBUFFERED=1
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - sonic_network

  # -------------------------------------------------------------
  # API Gateway & Backend (Node.js / Express)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonic_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/sonic_fingerprints
      - CHROMA_URL=http://chromadb:8000
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_started
      ml-service:
        condition: service_started
    networks:
      - sonic_network

  # -------------------------------------------------------------
  # Web Application Frontend (React / Vite / Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sonic_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sonic_network

networks:
  sonic_network:
    driver: bridge

volumes:
  mongo_data:
  chroma_data:
  panns_cache:
